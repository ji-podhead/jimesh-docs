<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <!-- Header Title -->
  <text x="600" y="50" fill="#ffffff" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="-0.5">Sandboxed Utility Browser Architecture for Autonomous Agents</text>
  <text x="600" y="78" fill="#94a3b8" font-size="16" text-anchor="middle">Isolated Execution · gVisor Sentry Boundary · Egress Allowlisting · Token-Optimized DOM Extraction</text>

  <!-- Node 1: AI Host Agent -->
  <g transform="translate(60, 150)" filter="url(#softShadow)">
    <rect width="240" height="420" rx="12" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="240" height="40" rx="12" fill="#38bdf8" opacity="0.15"/>
    <text x="120" y="26" fill="#38bdf8" font-weight="bold" font-size="16" text-anchor="middle">AI Agent Runtime</text>
    <text x="120" y="70" fill="#f8fafc" font-weight="bold" font-size="14" text-anchor="middle">LLM Core / Orchestrator</text>
    <text x="120" y="90" fill="#94a3b8" font-size="12" text-anchor="middle">(Claude / Custom Loop)</text>

    <!-- Sub-boxes -->
    <rect x="20" y="120" width="200" height="70" rx="8" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="120" y="145" fill="#7dd3fc" font-weight="bold" font-size="12" text-anchor="middle">MCP Protocol Client</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle">JSON-RPC / Tool Invocation</text>

    <rect x="20" y="210" width="200" height="70" rx="8" fill="#1e1b4b" opacity="0.5" stroke="#818cf8" stroke-width="1"/>
    <text x="120" y="235" fill="#a78bfa" font-weight="bold" font-size="12" text-anchor="middle">DOM Text Sanitizer</text>
    <text x="120" y="255" fill="#94a3b8" font-size="11" text-anchor="middle">Prompt Injection Filter</text>

    <rect x="20" y="300" width="200" height="90" rx="8" fill="#064e3b" opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="325" fill="#6ee7b7" font-weight="bold" font-size="12" text-anchor="middle">Context Window</text>
    <text x="120" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">Accessibility Trees &amp;</text>
    <text x="120" y="365" fill="#94a3b8" font-size="11" text-anchor="middle">Token-Reduced Snapshots</text>
  </g>

  <!-- Connector Line 1 -> 2 -->
  <line x1="300" y1="360" x2="380" y2="360" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="340" y="345" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">mcp/cdp</text>

  <!-- Node 2: Hardened Sandbox Boundary -->
  <g transform="translate(390, 120)" filter="url(#softShadow)">
    <!-- Outer Sandbox Box -->
    <rect width="420" height="480" rx="16" fill="#091328" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="10,5"/>
    <text x="210" y="32" fill="#a78bfa" font-weight="bold" font-size="15" text-anchor="middle">gVisor Sandbox Boundary (runsc Sentry)</text>

    <!-- Inner Container Box -->
    <rect x="20" y="50" width="380" height="400" rx="12" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="200" y="78" fill="#f8fafc" font-weight="bold" font-size="14" text-anchor="middle">Non-Root Docker Utility Container</text>
    <text x="200" y="96" fill="#64748b" font-size="11" text-anchor="middle">uid=10001 · read-only rootfs · cap-drop=ALL</text>

    <!-- Headless Browser Sub-box -->
    <rect x="40" y="120" width="320" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="145" fill="#38bdf8" font-weight="bold" font-size="13" text-anchor="middle">Headless Chromium Process</text>
    <line x1="60" y1="158" x2="340" y2="158" stroke="#334155" stroke-width="1"/>

    <text x="200" y="180" fill="#94a3b8" font-size="12" text-anchor="middle">CDP WebSocket Server (127.0.0.1:9222)</text>
    <text x="200" y="202" fill="#94a3b8" font-size="11" text-anchor="middle">• Disables local storage persistence</text>
    <text x="200" y="222" fill="#94a3b8" font-size="11" text-anchor="middle">• Ephemeral profile in /tmp (tmpfs)</text>
    <text x="200" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">• C++ level fingerprint spoofing</text>

    <!-- Security Badges inside container -->
    <rect x="40" y="290" width="150" height="60" rx="6" fill="#065f46" opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <text x="115" y="315" fill="#6ee7b7" font-weight="bold" font-size="11" text-anchor="middle">Seccomp Filter</text>
    <text x="115" y="333" fill="#94a3b8" font-size="10" text-anchor="middle">Blocked Syscalls</text>

    <rect x="210" y="290" width="150" height="60" rx="6" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="1"/>
    <text x="285" y="315" fill="#c084fc" font-weight="bold" font-size="11" text-anchor="middle">Cgroups v2</text>
    <text x="285" y="333" fill="#94a3b8" font-size="10" text-anchor="middle">1GB RAM / 1.0 CPU Cap</text>

    <rect x="40" y="365" width="320" height="65" rx="6" fill="#451a03" opacity="0.3" stroke="#f97316" stroke-width="1"/>
    <text x="200" y="390" fill="#fdba74" font-weight="bold" font-size="11" text-anchor="middle">Isolated Loopback Bridge</text>
    <text x="200" y="410" fill="#94a3b8" font-size="10" text-anchor="middle">No access to host 169.254.169.254 or k8s internal network</text>
  </g>

  <!-- Connector Line 2 -> 3 -->
  <line x1="810" y1="360" x2="890" y2="360" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="850" y="345" fill="#10b981" font-size="11" font-family="monospace" text-anchor="middle">TLS/HTTPS</text>

  <!-- Node 3: Outbound Egress & Target Web -->
  <g transform="translate(900, 180)" filter="url(#softShadow)">
    <rect width="240" height="360" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="40" rx="12" fill="#10b981" opacity="0.15"/>
    <text x="120" y="26" fill="#10b981" font-weight="bold" font-size="16" text-anchor="middle">Egress &amp; External Web</text>

    <rect x="20" y="60" width="200" height="70" rx="8" fill="#064e3b" opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="85" fill="#6ee7b7" font-weight="bold" font-size="12" text-anchor="middle">Egress Proxy / WAF</text>
    <text x="120" y="105" fill="#94a3b8" font-size="11" text-anchor="middle">Domain Allowlist Filter</text>

    <rect x="20" y="150" width="200" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="120" y="175" fill="#f8fafc" font-weight="bold" font-size="13" text-anchor="middle">Target Websites</text>
    <text x="120" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">• Cloudflare / WAF Protected</text>
    <text x="120" y="222" fill="#94a3b8" font-size="11" text-anchor="middle">• SaaS Portals / Web Apps</text>
    <text x="120" y="244" fill="#94a3b8" font-size="11" text-anchor="middle">• Public Data Sources</text>
    <line x1="40" y1="260" x2="200" y2="260" stroke="#334155" stroke-width="1"/>
    <text x="120" y="282" fill="#ef4444" font-weight="bold" font-size="11" text-anchor="middle">Blocked Targets:</text>
    <text x="120" y="302" fill="#94a3b8" font-size="10" text-anchor="middle">AWS Metadata (169.254.x)</text>
    <text x="120" y="318" fill="#94a3b8" font-size="10" text-anchor="middle">Internal Cluster IPs</text>
  </g>

  <!-- Bottom Brand Mark -->
  <g transform="translate(100, 620)">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="bold" letter-spacing="2">JIMESH RESEARCH DIGEST · AGENT BROWSER SANDBOX ARCHITECTURE</text>
  </g>
</svg>
