<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Header Title -->
  <text x="600" y="45" fill="#ffffff" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="-0.5">Agent Browser Execution Protocols: Trade-Off Matrix</text>
  <text x="600" y="70" fill="#94a3b8" font-size="15" text-anchor="middle">Evaluating Isolation, Latency, Memory Footprint &amp; LLM Compatibility Across 4 Architectures</text>

  <!-- Table Container -->
  <g transform="translate(50, 95)" filter="url(#softShadow)">
    <rect width="1100" height="520" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Table Header Row -->
    <rect width="1100" height="50" rx="12" fill="url(#headerGrad)"/>
    <line x1="0" y1="50" x2="1100" y2="50" stroke="#334155" stroke-width="1.5"/>

    <text x="150" y="32" fill="#38bdf8" font-weight="bold" font-size="13" text-anchor="middle">Dimension / Metric</text>
    <text x="370" y="32" fill="#f8fafc" font-weight="bold" font-size="13" text-anchor="middle">Playwright Driver (Node/Go)</text>
    <text x="600" y="32" fill="#f8fafc" font-weight="bold" font-size="13" text-anchor="middle">CDP Direct (chromedp)</text>
    <text x="825" y="32" fill="#f8fafc" font-weight="bold" font-size="13" text-anchor="middle">Browserless (Remote API)</text>
    <text x="1000" y="32" fill="#f8fafc" font-weight="bold" font-size="13" text-anchor="middle">VNC + noVNC (Headed)</text>

    <!-- Vertical Dividers -->
    <line x1="260" y1="0" x2="260" y2="520" stroke="#1e293b" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="520" stroke="#1e293b" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="520" stroke="#1e293b" stroke-width="1"/>
    <line x1="930" y1="0" x2="930" y2="520" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1: Protocol -->
    <g transform="translate(0, 50)">
      <rect width="1100" height="65" fill="#1e293b" opacity="0.3"/>
      <text x="20" y="38" fill="#f8fafc" font-weight="bold" font-size="13">Protocol / Control</text>
      <text x="370" y="30" fill="#cbd5e1" font-size="12" text-anchor="middle">Driver IPC / Node Bridge</text>
      <text x="370" y="48" fill="#64748b" font-size="11" text-anchor="middle">High-level auto-waiting API</text>

      <text x="600" y="30" fill="#38bdf8" font-weight="bold" font-size="12" text-anchor="middle">Direct WebSocket (CDP)</text>
      <text x="600" y="48" fill="#64748b" font-size="11" text-anchor="middle">Native Go / Zero Sidecars</text>

      <text x="825" y="30" fill="#cbd5e1" font-size="12" text-anchor="middle">REST / WebSocket CDP Proxy</text>
      <text x="825" y="48" fill="#64748b" font-size="11" text-anchor="middle">Stateless Remote Execution</text>

      <text x="1000" y="30" fill="#cbd5e1" font-size="12" text-anchor="middle">RFB over WebSockets</text>
      <text x="1000" y="48" fill="#64748b" font-size="11" text-anchor="middle">Pixel Framebuffer Streaming</text>
      <line x1="0" y1="65" x2="1100" y2="65" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 2: Latency & Overhead -->
    <g transform="translate(0, 115)">
      <text x="20" y="38" fill="#f8fafc" font-weight="bold" font-size="13">Latency &amp; Memory</text>
      <text x="370" y="30" fill="#fdba74" font-weight="bold" font-size="12" text-anchor="middle">Medium Latency</text>
      <text x="370" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">~200MB - 350MB / instance</text>

      <text x="600" y="30" fill="#6ee7b7" font-weight="bold" font-size="12" text-anchor="middle">Ultra-Low Latency</text>
      <text x="600" y="48" fill="#6ee7b7" font-size="11" text-anchor="middle">~80MB - 150MB / process</text>

      <text x="825" y="30" fill="#fdba74" font-size="12" text-anchor="middle">Network Dependent</text>
      <text x="825" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">~250MB+ / pod</text>

      <text x="1000" y="30" fill="#f87171" font-weight="bold" font-size="12" text-anchor="middle">High Latency</text>
      <text x="1000" y="48" fill="#f87171" font-size="11" text-anchor="middle">~450MB+ (X11 + VNC)</text>
      <line x1="0" y1="65" x2="1100" y2="65" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 3: Security & Isolation -->
    <g transform="translate(0, 180)">
      <rect width="1100" height="65" fill="#1e293b" opacity="0.3"/>
      <text x="20" y="38" fill="#f8fafc" font-weight="bold" font-size="13">Isolation Boundary</text>
      <text x="370" y="38" fill="#cbd5e1" font-size="12" text-anchor="middle">Container Level (Docker/runc)</text>
      <text x="600" y="38" fill="#a78bfa" font-weight="bold" font-size="12" text-anchor="middle">MicroVM / gVisor Compatible</text>
      <text x="825" y="38" fill="#cbd5e1" font-size="12" text-anchor="middle">Decoupled Remote Sandbox</text>
      <text x="1000" y="38" fill="#cbd5e1" font-size="12" text-anchor="middle">Container Framebuffer</text>
      <line x1="0" y1="65" x2="1100" y2="65" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 4: Agent & Vision Suitability -->
    <g transform="translate(0, 245)">
      <text x="20" y="38" fill="#f8fafc" font-weight="bold" font-size="13">Agent Suitability</text>
      <text x="370" y="30" fill="#6ee7b7" font-weight="bold" font-size="12" text-anchor="middle">High (Excellent)</text>
      <text x="370" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">DOM Snapshots + Visuals</text>

      <text x="600" y="30" fill="#6ee7b7" font-weight="bold" font-size="12" text-anchor="middle">Very High (Go Native)</text>
      <text x="600" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Direct Target Attaching</text>

      <text x="825" y="30" fill="#6ee7b7" font-weight="bold" font-size="12" text-anchor="middle">High (Serverless)</text>
      <text x="825" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">REST APIs for PDF / Snaps</text>

      <text x="1000" y="30" fill="#fdba74" font-weight="bold" font-size="12" text-anchor="middle">Human-in-the-Loop</text>
      <text x="1000" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Optimal for Live Debugging</text>
      <line x1="0" y1="65" x2="1100" y2="65" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 5: Primary Trade-offs -->
    <g transform="translate(0, 310)">
      <rect width="1100" height="75" fill="#1e293b" opacity="0.3"/>
      <text x="20" y="42" fill="#f8fafc" font-weight="bold" font-size="13">Primary Pros / Cons</text>

      <text x="370" y="28" fill="#6ee7b7" font-size="11" text-anchor="middle">PRO: Rich API, Auto-Wait</text>
      <text x="370" y="48" fill="#f87171" font-size="11" text-anchor="middle">CON: Heavy driver binaries</text>

      <text x="600" y="28" fill="#6ee7b7" font-size="11" text-anchor="middle">PRO: Zero runtime dependencies</text>
      <text x="600" y="48" fill="#f87171" font-size="11" text-anchor="middle">CON: Low-level event handling</text>

      <text x="825" y="28" fill="#6ee7b7" font-size="11" text-anchor="middle">PRO: Zero infrastructure ops</text>
      <text x="825" y="48" fill="#f87171" font-size="11" text-anchor="middle">CON: Cloud / license costs</text>

      <text x="1000" y="28" fill="#6ee7b7" font-size="11" text-anchor="middle">PRO: Full visual GUI access</text>
      <text x="1000" y="48" fill="#f87171" font-size="11" text-anchor="middle">CON: High CPU &amp; bandwidth</text>
      <line x1="0" y1="75" x2="1100" y2="75" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Summary Box at bottom of card -->
    <g transform="translate(20, 400)">
      <rect width="1060" height="100" rx="8" fill="#0284c7" opacity="0.1" stroke="#0284c7" stroke-width="1"/>
      <text x="30" y="30" fill="#38bdf8" font-weight="bold" font-size="14">Architectural Recommendation:</text>
      <text x="30" y="55" fill="#cbd5e1" font-size="12">• Use <tspan fill="#6ee7b7" font-weight="bold">CDP Direct (chromedp)</tspan> or <tspan fill="#6ee7b7" font-weight="bold">Playwright</tspan> inside a <tspan fill="#a78bfa" font-weight="bold">gVisor (runsc)</tspan> hardened container for automated LLM context loops.</text>
      <text x="30" y="78" fill="#cbd5e1" font-size="12">• Reserve <tspan fill="#fdba74" font-weight="bold">VNC / noVNC</tspan> strictly as an optional sidecar for human intervention (Captcha solving / OAuth consent steps).</text>
    </g>
  </g>
</svg>
