<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%">
  <defs>
    <filter id="sh6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1050" height="480" fill="#f8fafc" rx="12"/>
  <text x="525" y="30" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">The one real gap this research found in JiMesh's own Vault — shown honestly</text>

  <!-- write path -->
  <rect x="60" y="60" width="450" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7" filter="url(#sh6)"/>
  <text x="285" y="88" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">✓ WRITE TIME — this part is real</text>
  <text x="80" y="115" fill="#047857" font-family="sans-serif" font-size="10">vault_secrets.allowed_agents is written on</text>
  <text x="80" y="131" fill="#047857" font-family="sans-serif" font-size="10">secret creation/update.</text>
  <text x="80" y="153" fill="#047857" font-family="sans-serif" font-size="10">vault_tokens.agent_id is written on every</text>
  <text x="80" y="169" fill="#047857" font-family="sans-serif" font-size="10">token minted via CreateVaultToken().</text>
  <text x="80" y="195" fill="#059669" font-size="9" font-family="monospace">internal/store/vault.go:27,66</text>

  <!-- read path -->
  <rect x="540" y="60" width="450" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" filter="url(#sh6)"/>
  <text x="765" y="88" fill="#991b1b" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">✗ ACCESS TIME — never checked</text>
  <text x="560" y="115" fill="#b91c1c" font-family="sans-serif" font-size="10">GetVaultSecret does not filter by</text>
  <text x="560" y="131" fill="#b91c1c" font-family="sans-serif" font-size="10">allowed_agents at all.</text>
  <text x="560" y="153" fill="#b91c1c" font-family="sans-serif" font-size="10">ValidateVaultToken checks secret_name,</text>
  <text x="560" y="169" fill="#b91c1c" font-family="sans-serif" font-size="10">revoked, expires_at — never agent_id.</text>
  <text x="560" y="195" fill="#dc2626" font-size="9" font-family="monospace">internal/store/vault.go:172-185, 329-350</text>

  <line x1="510" y1="135" x2="540" y2="135" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="525" y="125" fill="#64748b" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">≠</text>

  <rect x="60" y="230" width="930" height="90" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="80" y="255" fill="#9a3412" font-family="sans-serif" font-weight="bold" font-size="12">Practical consequence</text>
  <text x="80" y="277" fill="#7c2d12" font-family="sans-serif" font-size="10">If a Gmail-style per-agent OAuth token were stored today, scoping it to "mail-reader-42" via allowed_agents would be PURELY DECORATIVE.</text>
  <text x="80" y="295" fill="#7c2d12" font-family="sans-serif" font-size="10">Any caller holding a valid token/scope for that secret NAME — regardless of which agent it actually names — can read it.</text>
  <text x="80" y="312" fill="#c2410c" font-family="sans-serif" font-size="9" font-style="italic">Mitigating factor: reaching Vault at all still requires passing the INGRESS-DERIVED-ONLY identity checks first — this is not a wide-open hole,</text>

  <rect x="60" y="330" width="930" height="120" rx="10" fill="#0f172a"/>
  <text x="525" y="356" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Why this is the good kind of finding</text>
  <text x="80" y="382" fill="#e2e8f0" font-family="sans-serif" font-size="10">The data model for per-agent secret scoping already exists. This is a couple of missing comparisons in two functions, not a missing</text>
  <text x="80" y="400" fill="#e2e8f0" font-family="sans-serif" font-size="10">architecture — the verified identity already flows through every other code path in the system (the gateway diagram above); Vault's own</text>
  <text x="80" y="418" fill="#e2e8f0" font-family="sans-serif" font-size="10">checks simply aren't consuming it yet. Fixing it is small and surgical, precisely because everything else was already built correctly.</text>
  <text x="525" y="440" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle" font-style="italic">Flagged, not fixed silently — this is what "shipping honest gaps instead of hiding them" looks like in practice.</text>
</svg>
