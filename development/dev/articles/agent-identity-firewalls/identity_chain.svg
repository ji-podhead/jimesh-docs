<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="100%" height="100%">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1050" height="620" fill="#f8fafc" rx="12"/>
  <text x="525" y="30" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">INGRESS-DERIVED-ONLY: the gateway is the only place identity is ever decided</text>

  <rect x="60" y="55" width="300" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" filter="url(#sh)"/>
  <text x="210" y="80" fill="#991b1b" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Agent's own request arrives</text>
  <text x="210" y="98" fill="#b91c1c" font-family="sans-serif" font-size="9" text-anchor="middle">Authorization: Bearer &lt;its key&gt;, X-JiMesh-Workspace-Id: &lt;anything it wants&gt;</text>
  <line x1="210" y1="111" x2="210" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 1: strip -->
  <rect x="30" y="145" width="990" height="90" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="55" y="170" fill="#9a3412" font-family="sans-serif" font-weight="bold" font-size="13">STEP 1 — Strip every client-supplied X-JiMesh-* header, unconditionally</text>
  <text x="55" y="190" fill="#7c2d12" font-family="sans-serif" font-size="10">Before any other logic runs. Any client-supplied copy of an identity header is treated as spoofing by definition — it never even reaches a decision.</text>
  <text x="55" y="208" fill="#c2410c" font-size="9" font-family="monospace">internal/auth/auth.go — Middleware, lines 615-621</text>

  <line x1="525" y1="235" x2="525" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: resolve -->
  <rect x="30" y="265" width="990" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="55" y="290" fill="#1e3a8a" font-family="sans-serif" font-weight="bold" font-size="13">STEP 2 — Resolve real identity server-side, from the credential that actually authenticated</text>
  <text x="55" y="310" fill="#1e40af" font-family="sans-serif" font-size="10">Not from anything the client claims. The Bearer token is hashed and looked up against the consumer_keys table — human, workspace, or one specific subagent instance.</text>
  <text x="55" y="328" fill="#2563eb" font-size="9" font-family="monospace">internal/store/consumer_keys.go — kind='user' | kind='service' (workspace|subagent)</text>

  <line x1="525" y1="355" x2="525" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: re-stamp -->
  <rect x="30" y="385" width="990" height="90" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="55" y="410" fill="#4c1d95" font-family="sans-serif" font-weight="bold" font-size="13">STEP 3 — Re-stamp the headers from the VERIFIED row, only now</text>
  <text x="55" y="430" fill="#3730a3" font-family="sans-serif" font-size="10">Every downstream handler reads X-JiMesh-Workspace-Id etc. — but the value now came from the database row the credential resolved to, never from the client.</text>
  <text x="55" y="448" fill="#6d28d9" font-size="9" font-family="monospace">internal/auth/auth.go, lines 689-699, 764-773, 889-897</text>

  <line x1="525" y1="475" x2="525" y2="500" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: deterministic gate -->
  <rect x="30" y="505" width="990" height="90" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="55" y="530" fill="#065f46" font-family="sans-serif" font-weight="bold" font-size="13">STEP 4 — Deterministic policy decides, outside the model entirely</text>
  <text x="55" y="550" fill="#047857" font-family="sans-serif" font-size="10">A Rego (OPA) policy evaluates the verified identity against granted capabilities — allow, guard (needs human approval), or deny. Fail-closed on any error.</text>
  <text x="55" y="568" fill="#059669" font-size="9" font-family="monospace">internal/policy/capabilities.go + internal/subagents/toolcalls.go</text>

  <rect x="230" y="600" width="590" height="14" rx="0" fill="none"/>
</svg>
