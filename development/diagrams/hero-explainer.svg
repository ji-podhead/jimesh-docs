<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="JiMesh Hero Explainer">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#090d16"/>

  <!-- Subtle Mesh Grid Background Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Glow effect under branding -->
  <circle cx="200" cy="180" r="180" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#a78bfa" opacity="0.1" filter="url(#glow)"/>

  <!-- Top Navigation / Badge Bar -->
  <rect x="60" y="40" width="220" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="80" cy="58" r="6" fill="#22d3ee"/>
  <text x="96" y="63" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">SELF-HOSTED CONTROL PLANE</text>

  <!-- Logo Cube Graphic — real JiMesh mark, exact geometry+colors from
       assets/icons/brand/svg/jimesh-mesh-cube-flat-small.svg (inlined,
       not referenced, so it renders on GitHub) -->
  <g transform="translate(60, 110) scale(0.18)">
    <circle cx="400" cy="400" r="380" fill="#05070b"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(400,400)">
      <g stroke="#00e5ff" stroke-width="7" stroke-dasharray="14 9" opacity="0.65">
        <line x1="0" y1="-150" x2="0" y2="-240"/><line x1="130" y1="-75" x2="208" y2="-120"/>
        <line x1="130" y1="75" x2="208" y2="120"/><line x1="0" y1="150" x2="0" y2="240"/>
        <line x1="-130" y1="75" x2="-208" y2="120"/><line x1="-130" y1="-75" x2="-208" y2="-120"/>
      </g>
      <g stroke="#00ffcc" stroke-width="9">
        <circle cx="0" cy="-240" r="15"/><circle cx="208" cy="-120" r="15"/><circle cx="208" cy="120" r="15"/>
        <circle cx="0" cy="240" r="15"/><circle cx="-208" cy="120" r="15"/><circle cx="-208" cy="-120" r="15"/>
      </g>
      <g fill="#00ffcc" stroke="none">
        <circle cx="0" cy="-240" r="7"/><circle cx="208" cy="-120" r="7"/><circle cx="208" cy="120" r="7"/>
        <circle cx="0" cy="240" r="7"/><circle cx="-208" cy="120" r="7"/><circle cx="-208" cy="-120" r="7"/>
      </g>
      <g stroke="#00e5ff" stroke-width="5" stroke-dasharray="10 7" opacity="0.4">
        <line x1="0" y1="0" x2="0" y2="-150"/><line x1="0" y1="0" x2="-130" y2="75"/><line x1="0" y1="0" x2="130" y2="75"/>
      </g>
      <g stroke="#00e5ff" stroke-width="14">
        <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
        <line x1="0" y1="0" x2="130" y2="-75"/><line x1="0" y1="0" x2="-130" y2="-75"/>
      </g>
      <g stroke="none">
        <polygon points="0,-49.5 44.98,-23.5 0,2.5 -44.98,-23.5" fill="#00ffcc"/>
        <polygon points="-44.98,-23.5 0,2.5 0,54.5 -44.98,28.5" fill="#00c78f"/>
        <polygon points="0,2.5 44.98,-23.5 44.98,28.5 0,54.5" fill="#00a344"/>
      </g>
    </g>
  </g>

  <!-- Title Text -->
  <text x="220" y="152" fill="url(#brandGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">JiMesh</text>
  <text x="220" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">Autonomous AI &amp; Infrastructure Gateway</text>

  <!-- Hero Catchphrase -->
  <text x="60" y="275" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700">Deploy Secure AI &amp; Apps in Seconds.</text>
  <text x="60" y="315" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Zero network config required. Control your hybrid cloud &amp; AI models from one unified dashboard.</text>

  <!-- Feature Cards Grid (3 Cards) -->

  <!-- Card 1: Vibe Coder Simplicity -->
  <g transform="translate(60, 360)">
    <rect width="330" height="210" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#0284c7" opacity="0.2"/>
    <path d="M46 36 L38 56 M36 42 L30 46 L36 50 M44 42 L50 46 L44 50" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="24" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Instant AI Deployments</text>
    <text x="24" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      <tspan x="24" dy="0">Ship apps &amp; AI agents instantly.</tspan>
      <tspan x="24" dy="20">No SSH keys, no .env file chaos,</tspan>
      <tspan x="24" dy="20">no complex port forwarding.</tspan>
    </text>
  </g>

  <!-- Card 2: Automatic Mesh Network -->
  <g transform="translate(435, 360)">
    <rect width="330" height="210" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#7c3aed" opacity="0.2"/>
    <path d="M38 36 C38 36, 46 32, 54 36 C54 36, 58 44, 54 52 C50 60, 38 60, 38 60" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="36" r="3" fill="#a78bfa"/><circle cx="54" cy="36" r="3" fill="#a78bfa"/><circle cx="46" cy="48" r="3" fill="#a78bfa"/>
    <text x="24" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Encrypted Mesh Overlay</text>
    <text x="24" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      <tspan x="24" dy="0">Bridges On-Prem, AWS, GCP &amp; VPS</tspan>
      <tspan x="24" dy="20">into a private, peer-to-peer network</tspan>
      <tspan x="24" dy="20">shielded from the public web.</tspan>
    </text>
  </g>

  <!-- Card 3: One Dashboard -->
  <g transform="translate(810, 360)">
    <rect width="330" height="210" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#059669" opacity="0.2"/>
    <rect x="34" y="34" width="24" height="18" rx="3" stroke="#34d399" stroke-width="2" fill="none"/>
    <path d="M34 56 H58" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Single Control Plane</text>
    <text x="24" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      <tspan x="24" dy="0">Manage LLM fallback chains, budget</tspan>
      <tspan x="24" dy="20">guardrails, Vault secrets &amp; gVisor</tspan>
      <tspan x="24" dy="20">sandboxes from one clean UI.</tspan>
    </text>
  </g>
</svg>
