<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="JiMesh Kernel and Network Isolation Concept">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="50" y="45" fill="url(#brandGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Kernel &amp; Network Isolation Concept</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Dual-layer defense: gVisor kernel sandboxing + Private WireGuard mesh gateway</text>

  <!-- Untrusted / Public Internet Outer Ring (Blocked) -->
  <rect x="50" y="100" width="280" height="350" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="70" y="120" width="160" height="30" rx="6" fill="#991b1b"/>
  <text x="85" y="140" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Public Internet (Blocked)</text>
  <text x="70" y="180" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">❌ Direct Port Access: Blocked</text>
  <text x="70" y="210" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">❌ Untrusted Traffic: Rejected</text>
  <text x="70" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">❌ Unbound Sockets: Blocked</text>

  <!-- Locked Gate / Mesh Boundary in middle -->
  <g transform="translate(370, 180)">
    <circle cx="50" cy="80" r="45" fill="#0369a1" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
    <!-- Lock Icon -->
    <path d="M 40 75 V 65 C 40 55, 60 55, 60 65 V 75 M 35 75 H 65 V 95 H 35 Z" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="50" y="150" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">JiMesh Secure</text>
    <text x="50" y="168" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">JiMesh Gateway</text>
  </g>

  <!-- Inner Sandbox Box (Protected Application) -->
  <g transform="translate(520, 100)">
    <!-- Outer Shield Box -->
    <rect width="430" height="350" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="3" filter="url(#glow)"/>
    <rect x="24" y="20" width="220" height="32" rx="6" fill="#4c1d95"/>
    <text x="36" y="41" fill="#ddd6fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">🔒 gVisor Sandboxed Container</text>

    <!-- App Container Inside Box -->
    <rect x="30" y="70" width="370" height="150" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="50" y="100" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Application / AI Workload</text>
    <text x="50" y="125" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13">• System calls trapped by runsc Sentry</text>
    <text x="50" y="145" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13">• Isolated Virtual Memory &amp; Kernel Space</text>
    <text x="50" y="165" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13">• Loopback 127.0.0.1 Binding Only</text>
    <text x="50" y="185" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13">• Egress Proxy &amp; Socket Guard Active</text>

    <!-- Bottom Vault / Secret Bar -->
    <rect x="30" y="240" width="370" height="80" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="50" y="268" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Zero-Trust Vault Secret Delivery</text>
    <text x="50" y="292" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12">Runtime secret injection — zero plain API keys stored on disk.</text>
  </g>
</svg>
