<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="JiMesh LinkedIn Announcement Graphic">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#110d29"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with ambient glows -->
  <rect width="1200" height="628" fill="url(#bgGrad)"/>
  <rect width="1200" height="628" fill="url(#cyanGlow)"/>
  <rect width="1200" height="628" fill="url(#violetGlow)"/>

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <path d="M0 157 H1200 M0 314 H1200 M0 471 H1200"/>
    <path d="M300 0 V628 M600 0 V628 M900 0 V628"/>
  </g>

  <!-- Top Announcement Badge -->
  <rect x="80" y="60" width="280" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="102" cy="79" r="6" fill="#22d3ee"/>
  <text x="120" y="84" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">INTRODUCING JIMESH</text>

  <!-- Main Headline -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">The Self-Hosted</text>
  <text x="80" y="235" fill="url(#brandGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">AI &amp; Infrastructure Mesh</text>

  <!-- Subheadline -->
  <text x="80" y="300" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">
    <tspan x="80" dy="0">Deploy sandboxed AI workloads across AWS, GCP, On-Prem &amp; VPS</tspan>
    <tspan x="80" dy="30">in seconds. Zero network configuration required.</tspan>
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(80, 385)">
    <!-- Pill 1 -->
    <rect width="210" height="42" rx="21" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="105" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🛡️ gVisor Sandboxed</text>

    <!-- Pill 2 -->
    <rect x="225" width="210" height="42" rx="21" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="330" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ LLM Failover Proxy</text>

    <!-- Pill 3 -->
    <rect x="450" width="210" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="555" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔑 Zero-Trust Vault</text>
  </g>

  <!-- Call to Action Banner -->
  <g transform="translate(80, 480)">
    <rect width="680" height="64" rx="16" fill="url(#brandGrad)"/>
    <text x="340" y="40" fill="#090d16" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Explore on GitHub → github.com/ji-podhead/jimesh</text>
  </g>

  <!-- Right Side Cube Graphic -->
  <g transform="translate(880, 150) scale(0.45)">
    <circle cx="400" cy="400" r="380" fill="#0f172a" stroke="#22d3ee" stroke-width="6"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(400,400)">
      <g stroke="#22d3ee" stroke-width="8" stroke-dasharray="14 9" opacity="0.8">
        <line x1="0" y1="-150" x2="0" y2="-240"/><line x1="130" y1="-75" x2="208" y2="-120"/>
        <line x1="130" y1="75" x2="208" y2="120"/><line x1="0" y1="150" x2="0" y2="240"/>
        <line x1="-130" y1="75" x2="-208" y2="120"/><line x1="-130" y1="-75" x2="-208" y2="-120"/>
      </g>
      <g stroke="#a78bfa" stroke-width="10">
        <circle cx="0" cy="-240" r="16"/><circle cx="208" cy="-120" r="16"/><circle cx="208" cy="120" r="16"/>
        <circle cx="0" cy="240" r="16"/><circle cx="-208" cy="120" r="16"/><circle cx="-208" cy="-120" r="16"/>
      </g>
      <g stroke="#22d3ee" stroke-width="14">
        <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"/>
        <line x1="0" y1="0" x2="130" y2="-75"/><line x1="0" y1="0" x2="-130" y2="-75"/>
      </g>
      <g stroke="none">
        <polygon points="0,-49.5 44.98,-23.5 0,2.5 -44.98,-23.5" fill="#22d3ee"/>
        <polygon points="-44.98,-23.5 0,2.5 0,54.5 -44.98,28.5" fill="#38bdf8"/>
        <polygon points="0,2.5 44.98,-23.5 44.98,28.5 0,54.5" fill="#a78bfa"/>
      </g>
    </g>
  </g>
</svg>
