<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="JiMesh Deployment Flow">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="320" fill="#090d16" rx="16"/>

  <!-- Title Header -->
  <text x="50" y="45" fill="url(#brandGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">JiMesh 4-Step Deployment Flow</text>
  <text x="50" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">From bare server to sandboxed production deployment in under 60 seconds</text>

  <!-- Flow Connector Line -->
  <path d="M 170 180 H 930" stroke="#334155" stroke-width="4"/>
  <path d="M 170 180 H 930" stroke="url(#brandGrad)" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Step 1: Connect Server -->
  <g transform="translate(50, 100)">
    <rect width="210" height="160" rx="14" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="105" cy="36" r="20" fill="#0284c7" opacity="0.3"/>
    <text x="105" y="42" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">1</text>
    <text x="105" y="82" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Connect Node</text>
    <text x="105" y="110" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Add host IP via SSH</text>
    <text x="105" y="128" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">or 1-click installer</text>
  </g>

  <!-- Step 2: Configure Workspace -->
  <g transform="translate(310, 100)">
    <rect width="210" height="160" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="105" cy="36" r="20" fill="#0369a1" opacity="0.3"/>
    <text x="105" y="42" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">2</text>
    <text x="105" y="82" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Set AI Guardrails</text>
    <text x="105" y="110" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Assign API keys, Vault</text>
    <text x="105" y="128" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">secrets &amp; budget caps</text>
  </g>

  <!-- Step 3: Trigger Deployment -->
  <g transform="translate(570, 100)">
    <rect width="210" height="160" rx="14" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="105" cy="36" r="20" fill="#6d28d9" opacity="0.3"/>
    <text x="105" y="42" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
    <text x="105" y="82" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Auto-Mesh &amp; IaC</text>
    <text x="105" y="110" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Ansible provisions gVisor</text>
    <text x="105" y="128" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">&amp; WireGuard overlay</text>
  </g>

  <!-- Step 4: Live & Shielded -->
  <g transform="translate(830, 100)">
    <rect width="220" height="160" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <circle cx="110" cy="36" r="20" fill="#047857" opacity="0.3"/>
    <text x="110" y="42" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">4</text>
    <text x="110" y="82" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Live &amp; Secured 🛡️</text>
    <text x="110" y="110" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">App active in mesh.</text>
    <text x="110" y="128" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Stream logs in UI.</text>
  </g>
</svg>
