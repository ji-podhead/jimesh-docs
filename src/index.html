<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JiMesh API Reference</title>
<style>
:root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #0b0d11; color: #e7e9ee; min-height: 100vh; }
header { display: flex; align-items: center; gap: 1.25rem; padding: .7rem 1.25rem; border-bottom: 1px solid #ffffff18; flex-wrap: wrap; }
header .brand { display: flex; align-items: baseline; gap: .6rem; }
header .brand strong { font-size: 1.05em; letter-spacing: .04em; }
nav.tabs { display: flex; gap: .25rem; flex-wrap: wrap; }
nav.tabs a { color: #b8bec9; padding: .35em .8em; border-radius: 999px; text-decoration: none; font-size: .9em; border: 1px solid transparent; cursor: pointer; }
nav.tabs a:hover { color: #fff; background: #ffffff14; }
nav.tabs a.active { color: #fff; background: #ffffff1f; border-color: #ffffff35; }
header .links { margin-left: auto; display: flex; gap: .9rem; font-size: .9em; }
header .links a { color: #8ab4f8; text-decoration: none; }
header .links a:hover { text-decoration: underline; }
.gateway-bar { display: flex; gap: .6rem; align-items: center; padding: .8rem 1.25rem; border-bottom: 1px solid #ffffff18; font-size: .9em; color: #b8bec9; flex-wrap: wrap; }
.gateway-bar label { white-space: nowrap; }
.gateway-bar input { background: #ffffff0f; border: 1px solid #ffffff2b; color: #e7e9ee; padding: .45em .7em; border-radius: 6px; min-width: 300px; flex: 1; max-width: 480px; font-size: .95em; font-family: ui-monospace, monospace; }
.gateway-bar button { background: #2f6fed; border: none; color: #fff; padding: .5em 1em; border-radius: 6px; cursor: pointer; font-size: .95em; }
.gateway-bar button:hover { background: #245bd0; }
main { display: flex; flex-direction: column; min-height: calc(100vh - 114px); }
#api-reference, .scalar-boot { flex: 1; min-height: 60vh; }
.scalar-boot { display: grid; place-items: center; color: #b8bec9; padding: 2rem 1.25rem; text-align: center; }
.scalar-boot .hint { max-width: 62ch; line-height: 1.65; font-size: .95em; }
.scalar-boot code { background: #ffffff14; padding: .1em .35em; border-radius: 4px; font-family: ui-monospace, monospace; }
.scalar-boot .err { color: #ff9d9d; margin-top: 1em; font-size: .9em; }
</style>
</head>
<body>
<header>
  <span class="brand"><strong>JiMesh</strong><span style="color:#b8bec9;font-size:.9em">API reference</span></span>
  <nav class="tabs">
    <a data-spec="public">Public API</a>
    <a data-spec="live">Live gateway</a>
  </nav>
  <span class="links">
    <a href="docs/API_DOCS.html">API reference (rendered)</a>
    <a href="docs/API_ENDPOINTS.html">Endpoint index</a>
    <a href="docs/overview.html">Docs: Overview</a>
    <a href="docs/getting-started.html">Docs: Getting started</a>
    <a href="docs/architecture.html">Docs: Architecture</a>
    <a href="openapi/index.html">OpenAPI endpoints</a>
  </span>
</header>

<div class="gateway-bar" id="gateway-bar">
  <label for="gateway-base" id="gateway-bar-label">Gateway base URL (try-it requests):</label>
  <input id="gateway-base" placeholder="http://&lt;host&gt;:19091" spellcheck="false">
  <button id="gateway-load" type="button">Load</button>
  <span id="gateway-status" style="color:#b8bec9"></span>
</div>

<main>
  <div id="api-reference" style="display:none"></div>
  <div class="scalar-boot" id="boot-msg">
    <div class="hint" id="boot-text"></div>
    <div class="hint err" id="boot-err"></div>
  </div>
</main>

<script>
(function () {
  var SCALAR_CDN = "https://cdn.jsdelivr.net/npm/@scalar/api-reference";
  var PUBLIC_SPEC_URL = "spec/gateway.public.openapi.json";
  var DEFAULT_BASE = "http://localhost:19091";
  var STORE_BASE = "jimesh.gatewayBase";

  var spec = new URLSearchParams(location.search).get("spec");
  if (!/^(public|live)$/.test(spec)) spec = "public";

  var tabs = document.querySelectorAll("nav.tabs a");
  tabs.forEach(function (t) {
    t.classList.toggle("active", t.dataset.spec === spec);
    t.href = "?spec=" + t.dataset.spec;
  });

  var bar = document.getElementById("gateway-bar");
  var barLabel = document.getElementById("gateway-bar-label");
  var bootMsg = document.getElementById("boot-msg");
  var bootText = document.getElementById("boot-text");
  var apiRef = document.getElementById("api-reference");
  var statusEl = document.getElementById("gateway-status");
  var errEl = document.getElementById("boot-err");
  var baseInput = document.getElementById("gateway-base");

  bootText.innerHTML = spec === "live"
    ? "<strong>Live gateway</strong> fetches <code>GET &lt;base&gt;/openapi.json</code> straight from a running backend — the doc always matches that deployment. The gateway allows CORS (<code>*</code>), so the fetch works cross-origin; if it fails, the loader reports the real error instead of guessing."
    : "<strong>Public API</strong> renders the bundled OpenAPI 3.1 spec exported by <code>make openapi-spec</code> (route registry + overlay, reviewed in the backend repo). Try-it requests go to the gateway base URL below — set it to a reachable gateway (CORS is open) and Scalar sends the requests from your browser.";

  function readBase() {
    try { return localStorage.getItem(STORE_BASE) || DEFAULT_BASE; } catch (e) { return DEFAULT_BASE; }
  }
  baseInput.value = readBase();

  function saveBase() {
    var v = baseInput.value.trim();
    if (v) { try { localStorage.setItem(STORE_BASE, v); } catch (e) {} }
    return v || DEFAULT_BASE;
  }

  var scalarPromise = null;
  function loadScalar() {
    if (window.Scalar && window.Scalar.createApiReference) return Promise.resolve();
    if (!scalarPromise) {
      scalarPromise = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = SCALAR_CDN;
        s.onload = resolve;
        s.onerror = function () { reject(new Error("could not load Scalar from " + SCALAR_CDN)); };
        document.head.appendChild(s);
      });
    }
    return scalarPromise;
  }

  function showRef(json, base) {
    // Rewrite servers so "try it" targets the gateway the user entered; the
    // bundled spec keeps localhost as a sane default for local Scalar use.
    if (json && json.servers && json.servers.length && base) {
      json.servers = [{ url: base, description: "user-selected gateway (try-it)" }].concat(json.servers);
    }
    bootMsg.style.display = "none";
    apiRef.style.display = "";
    // recreate cleanly when switching tabs / reloading
    while (apiRef.firstChild) apiRef.removeChild(apiRef.firstChild);
    loadScalar().then(function () {
      window.Scalar.createApiReference(apiRef, {
        spec: { content: json },
        configuration: {
          theme: "purple",
          hideModels: false,
          hideClientButton: false,
          documentDownloadType: "direct",
          layout: "modern"
        }
      });
      statusEl.textContent = "loaded (openapi " + (json.openapi || "?") + ", " + base + ")";
    }).catch(function (e) {
      errEl.textContent = e.message;
      bootMsg.style.display = "";
      apiRef.style.display = "none";
    });
  }

  function fail(msg) {
    errEl.textContent = msg;
    bootMsg.style.display = "";
    apiRef.style.display = "none";
    statusEl.textContent = "";
  }

  function loadPublic() {
    errEl.textContent = "";
    var base = saveBase();
    statusEl.textContent = "fetching " + PUBLIC_SPEC_URL + " ...";
    fetch(PUBLIC_SPEC_URL)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " from " + PUBLIC_SPEC_URL);
        return r.json();
      })
      .then(function (json) {
        if (!json || !json.openapi) throw new Error("not an OpenAPI document");
        showRef(json, base);
      })
      .catch(function (e) { fail("Bundled spec fetch failed: " + e.message); });
  }

  function loadLive() {
    errEl.textContent = "";
    var base = saveBase().replace(/\/+$/, "");
    if (!/^https?:\/\//.test(base)) {
      fail("Base URL must start with http:// or https://");
      return;
    }
    var url = base + "/openapi.json";
    statusEl.textContent = "fetching " + url + " ...";
    fetch(url, { method: "GET" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " from " + url);
        return r.json();
      })
      .then(function (json) {
        if (!json || !json.openapi) throw new Error("not an OpenAPI document");
        showRef(json, base);
      })
      .catch(function (e) { fail("Gateway spec fetch failed: " + e.message); });
  }

  document.getElementById("gateway-load").addEventListener("click", function () {
    if (spec === "live") loadLive(); else loadPublic();
  });
  baseInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("gateway-load").click();
  });

  barLabel.textContent = spec === "live"
    ? "Gateway base URL (spec source):"
    : "Gateway base URL (try-it requests):";

  if (spec === "live") loadLive(); else loadPublic();
})();
</script>
</body>
</html>
